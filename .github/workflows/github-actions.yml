name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  lint-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd client
      - run: npm ci
      - run: npm run lint

  build-client:
    needs: lint-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd client
      - run: npm ci
      - run: npm run build

  lint-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd server
      - run: npm ci
      - run: npm run lint

  build-server:
    needs: lint-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd server
      - run: npm ci
      - run: npm run build

  test-server:
    needs: build-server
    runs-on: ubuntu-latest
    env:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: app
      PGPASSWORD: app_pw
      PGDATABASE: app_test_db
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_pw
          POSTGRES_DB: app_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: apt-get update && apt-get install -y postgresql-client
      - run: psql -h postgres -U app -d app_test_db -f db/init/001-schema.sql
      - run: cd server
      - run: npm ci
      - run: npm test

  test-e2e:
    needs: [test-server, build-client]
    runs-on: ubuntu-latest
    env:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: app
      PGPASSWORD: app_pw
      PGDATABASE: app_db
      E2E_BASE_URL: 'http://localhost:4173'
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_pw
          POSTGRES_DB: app_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: apt-get update && apt-get install -y postgresql-client
      - run: psql -h postgres -U app -d app_db -f db/init/001-schema.sql
      - run: cd server && npm ci
      - run: npm run start:ci &
      - run: cd ../client && npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npx vite preview --port 4173 --host &
      - run: sleep 5
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
